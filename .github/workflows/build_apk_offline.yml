name: Build Android APK Offline - AGOS Smart Diagnostik

on:
  workflow_dispatch:
  push:
    branches:
      - apk-offline

jobs:
  build-offline-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (Export & Verify Data)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Export Offline JSON Data & Bundle Local FontAwesome
        run: |
          python3 android_offline/tools/export_data.py
          mkdir -p android_offline/www/css android_offline/www/webfonts
          FA="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1"
          curl -sSL "$FA/css/all.min.css" -o android_offline/www/css/fontawesome.min.css
          curl -sSL "$FA/webfonts/fa-solid-900.woff2" -o android_offline/www/webfonts/fa-solid-900.woff2
          curl -sSL "$FA/webfonts/fa-regular-400.woff2" -o android_offline/www/webfonts/fa-regular-400.woff2
          curl -sSL "$FA/webfonts/fa-brands-400.woff2" -o android_offline/www/webfonts/fa-brands-400.woff2

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build Tailwind CSS
        working-directory: android_offline
        run: |
          npm install
          npx tailwindcss -i ./src/input.css -o ./www/css/app.css --minify

      - name: Set up Java Development Kit (JDK 21 for Capacitor 6)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate & Sync Capacitor Android Project
        working-directory: android_offline
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          python3 tools/patch_android_project.py

      - name: Build Debug APK (Siap Pasang di HP)
        working-directory: android_offline/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../AGOS-Smart-Diagnostik-Offline.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agos-diagnostik-offline-apk
          path: android_offline/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish APK to GitHub Release (Direct Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.1-offline
          name: "AGOS Smart Diagnostik v1.2.1 — APK Android Full Offline (Perbaikan Tampilan & Layar Horizontal)"
          body: "File instalasi APK Android Full Offline (Tanpa Server & Tanpa Internet) dengan perbaikan tombol komponen horizontal, gambar simulasi penuh tanpa geser, dan dukungan layar Horizontal/Landscape."
          files: android_offline/AGOS-Smart-Diagnostik-Offline.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
